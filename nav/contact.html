<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Portfolio Zafitombo Antonio</title>
    <script src="https://kit.fontawesome.com/a36ef09c1e.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/contact.css">
</head>

<body>
    <nav class="navbar">
        <a href="../index.html" class="logo">Portfolio.</a>
        <ul>
            <li><a href="../index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="portfolio.html">Portfolio</a></li>
            <li><a href="service.html">Service</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <section class="contact-page-content">
        <h2>Contact <span>Me</span></h2>

        <p class="contact-intro">
            Have a project in mind or an opportunity to share?
            Let's connect and turn ideas into meaningful digital solutions.
        </p>
        
        <form form action="mailto:zafitomboantonio007@gmail.com"
            method="POST"
            enctype="text/plain">
            <div class="input-box">
                <input type="text" name="name" placeholder="Full Name" required>
                <input type="email" name="email" placeholder="Email Address" required>
            </div>
            <div class="input-box">
                <input type="tel" name="phone" placeholder="Phone Number">
                <input type="text" name="subject" placeholder="Subject">
            </div>
            <textarea name="message" cols="30" rows="10" placeholder="Your Message" required></textarea>
            <button type="submit" class="btn">Send Message</button>
        </form>
    </section>

    <script src="../nav.js"></script>
</body>

</html>
